<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Grind Log</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --charcoal: #1a1a1a;
    --card: #222222;
    --card2: #2a2a2a;
    --orange: #f97316;
    --orange-dim: rgba(249,115,22,0.15);
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.12);
    --blue: #38bdf8;
    --blue-dim: rgba(56,189,248,0.12);
    --rose: #fb7185;
    --rose-dim: rgba(251,113,133,0.12);
    --muted: #555;
    --text: #e5e5e5;
    --text-dim: #888;
  }

- { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
background-color: #0a0a0a;
}

body {
background-color: #0a0a0a !important;
background: #0a0a0a !important;
color: #e5e5e5 !important;
font-family: ‘DM Sans’, sans-serif;
min-height: 100vh;
min-height: -webkit-fill-available;
padding-bottom: 100px;
-webkit-text-size-adjust: 100%;
}

/* HEADER */
.header {
background-color: #1a1a1a;
background: #1a1a1a;
border-bottom: 1px solid #2a2a2a;
padding: 20px 20px 0;
padding-top: max(20px, env(safe-area-inset-top));
position: -webkit-sticky;
position: sticky;
top: 0;
z-index: 100;
}
.header-top {
display: flex;
justify-content: space-between;
align-items: flex-start;
margin-bottom: 16px;
}
.app-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 28px;
letter-spacing: 2px;
color: var(–orange);
}
.app-subtitle {
font-size: 11px;
color: var(–text-dim);
letter-spacing: 1px;
text-transform: uppercase;
margin-top: 2px;
}
.week-badge {
background: var(–orange-dim);
border: 1px solid var(–orange);
color: var(–orange);
font-family: ‘Bebas Neue’, sans-serif;
font-size: 14px;
letter-spacing: 1px;
padding: 4px 10px;
border-radius: 4px;
}

/* TABS */
.tabs {
display: flex;
gap: 0;
border-bottom: 1px solid #2a2a2a;
}
.tab {
flex: 1;
padding: 12px 4px;
font-size: 11px;
font-weight: 600;
letter-spacing: 1px;
text-transform: uppercase;
color: var(–text-dim);
background: none;
border: none;
cursor: pointer;
border-bottom: 2px solid transparent;
transition: all 0.2s;
}
.tab.active {
color: var(–orange);
border-bottom-color: var(–orange);
}

/* CONTENT */
.content { padding: 20px; }
.page { display: none; }
.page.active { display: block; }

/* WEIGHT CARD */
.weight-hero {
background-color: #222222;
background: #222222;
border-radius: 16px;
padding: 24px;
margin-bottom: 16px;
text-align: center;
border: 1px solid #2a2a2a;
}
.weight-current {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 72px;
color: var(–orange);
line-height: 1;
}
.weight-unit {
font-size: 18px;
color: var(–text-dim);
margin-bottom: 8px;
}
.weight-row {
display: flex;
justify-content: center;
gap: 24px;
margin-top: 12px;
}
.weight-stat { text-align: center; }
.weight-stat-val {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 22px;
color: var(–green);
}
.weight-stat-label {
font-size: 10px;
color: var(–text-dim);
text-transform: uppercase;
letter-spacing: 1px;
}

/* PROGRESS BAR */
.progress-section {
background-color: #222222;
background: #222222;
border-radius: 16px;
padding: 20px;
margin-bottom: 16px;
border: 1px solid #2a2a2a;
}
.progress-label {
display: flex;
justify-content: space-between;
font-size: 12px;
color: var(–text-dim);
margin-bottom: 10px;
text-transform: uppercase;
letter-spacing: 1px;
}
.progress-bar-bg {
background: #333;
border-radius: 99px;
height: 10px;
overflow: hidden;
}
.progress-bar-fill {
background: linear-gradient(90deg, var(–orange), #facc15);
height: 100%;
border-radius: 99px;
transition: width 0.6s ease;
}

/* LOG WEIGHT */
.log-section {
background-color: #222222;
background: #222222;
border-radius: 16px;
padding: 20px;
margin-bottom: 16px;
border: 1px solid #2a2a2a;
}
.section-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 18px;
letter-spacing: 1px;
color: var(–text);
margin-bottom: 14px;
}
.input-row {
display: flex;
gap: 10px;
}
.weight-input {
flex: 1;
background: #111;
border: 1px solid #333;
border-radius: 10px;
color: var(–text);
font-family: ‘DM Sans’, sans-serif;
font-size: 18px;
padding: 12px 16px;
outline: none;
}
.weight-input:focus { border-color: var(–orange); }
.btn-log {
background: var(–orange);
color: white;
border: none;
border-radius: 10px;
font-family: ‘Bebas Neue’, sans-serif;
font-size: 16px;
letter-spacing: 1px;
padding: 12px 20px;
cursor: pointer;
transition: opacity 0.2s;
}
.btn-log:active { opacity: 0.8; }

/* HISTORY */
.history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.history-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 14px;
background: #111;
border-radius: 10px;
font-size: 14px;
}
.history-date { color: var(–text-dim); font-size: 12px; }
.history-weight { font-family: ‘Bebas Neue’, sans-serif; font-size: 20px; color: var(–text); }
.history-delta { font-size: 12px; font-weight: 600; }
.delta-down { color: var(–green); }
.delta-up { color: var(–rose); }

/* MILESTONES */
.milestone-list { display: flex; flex-direction: column; gap: 8px; }
.milestone-item {
display: flex;
align-items: center;
gap: 12px;
padding: 12px 16px;
background: #111;
border-radius: 10px;
}
.milestone-dot {
width: 10px; height: 10px;
border-radius: 50%;
background: #333;
flex-shrink: 0;
}
.milestone-dot.reached { background: var(–green); }
.milestone-dot.current { background: var(–orange); box-shadow: 0 0 8px var(–orange); }
.milestone-month { font-family: ‘Bebas Neue’, sans-serif; font-size: 16px; color: var(–text-dim); width: 50px; }
.milestone-target { font-family: ‘Bebas Neue’, sans-serif; font-size: 20px; color: var(–text); }
.milestone-label { font-size: 11px; color: var(–text-dim); }
.milestone-check { margin-left: auto; color: var(–green); font-size: 18px; }

/* SCHEDULE */
.day-cards { display: flex; flex-direction: column; gap: 12px; }
.day-card {
background-color: #222222;
background: #222222;
border-radius: 16px;
overflow: hidden;
border: 1px solid #2a2a2a;
}
.day-header {
display: flex;
align-items: center;
gap: 12px;
padding: 14px 18px;
cursor: pointer;
}
.day-dot {
width: 12px; height: 12px;
border-radius: 50%;
flex-shrink: 0;
}
.day-name {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 20px;
letter-spacing: 1px;
flex: 1;
}
.day-type {
font-size: 11px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 1px;
padding: 3px 9px;
border-radius: 99px;
}
.day-chevron { color: var(–text-dim); font-size: 14px; transition: transform 0.2s; }
.day-card.open .day-chevron { transform: rotate(180deg); }

.day-body { display: none; padding: 0 18px 16px; }
.day-card.open .day-body { display: block; }

.time-badge {
display: inline-block;
font-size: 11px;
color: var(–text-dim);
background: #111;
border-radius: 6px;
padding: 4px 10px;
margin-bottom: 12px;
letter-spacing: 0.5px;
}
.exercise-list { display: flex; flex-direction: column; gap: 6px; }
.exercise-item {
display: flex;
align-items: center;
gap: 10px;
font-size: 14px;
color: var(–text);
padding: 2px 0;
}
.exercise-bullet {
width: 6px; height: 6px;
border-radius: 50%;
flex-shrink: 0;
}
.exercise-sets { font-size: 12px; color: var(–text-dim); margin-left: auto; }

.jazz-tag {
display: inline-flex;
align-items: center;
gap: 6px;
background: var(–rose-dim);
border: 1px solid var(–rose);
color: var(–rose);
font-size: 11px;
font-weight: 600;
letter-spacing: 1px;
text-transform: uppercase;
padding: 3px 10px;
border-radius: 99px;
margin-bottom: 10px;
}

/* TYPE COLORS */
.type-gym { color: var(–orange); }
.dot-gym { background: var(–orange); }
.bg-gym { background: var(–orange-dim); color: var(–orange); }

.type-walk { color: var(–green); }
.dot-walk { background: var(–green); }
.bg-walk { background: var(–green-dim); color: var(–green); }

.type-golf { color: var(–blue); }
.dot-golf { background: var(–blue); }
.bg-golf { background: var(–blue-dim); color: var(–blue); }

.type-rest { color: var(–text-dim); }
.dot-rest { background: var(–muted); }
.bg-rest { background: #1a1a1a; color: var(–text-dim); }

.type-jazz { color: var(–rose); }

/* LOG PAGE */
.log-day-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 6px;
margin-bottom: 16px;
}
.log-day-btn {
aspect-ratio: 1;
border-radius: 10px;
border: 1px solid #333;
background: #111;
color: var(–text-dim);
font-size: 10px;
font-weight: 600;
text-transform: uppercase;
cursor: pointer;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 2px;
transition: all 0.2s;
}
.log-day-btn .day-abbr { font-family: ‘Bebas Neue’, sans-serif; font-size: 14px; }
.log-day-btn.logged { background: var(–green-dim); border-color: var(–green); color: var(–green); }
.log-day-btn.selected { background: var(–orange-dim); border-color: var(–orange); color: var(–orange); }

.session-checklist { display: flex; flex-direction: column; gap: 8px; }
.check-item {
display: flex;
align-items: center;
gap: 12px;
background: #111;
border-radius: 10px;
padding: 12px 14px;
cursor: pointer;
transition: background 0.15s;
}
.check-item:active { background: #1a1a1a; }
.check-box {
width: 22px; height: 22px;
border-radius: 6px;
border: 2px solid #444;
display: flex; align-items: center; justify-content: center;
flex-shrink: 0;
transition: all 0.2s;
font-size: 14px;
}
.check-item.checked .check-box {
background: var(–green);
border-color: var(–green);
color: white;
}
.check-label { font-size: 14px; }
.check-sub { font-size: 11px; color: var(–text-dim); }

.btn-save-log {
width: 100%;
background: var(–orange);
color: white;
border: none;
border-radius: 12px;
font-family: ‘Bebas Neue’, sans-serif;
font-size: 18px;
letter-spacing: 2px;
padding: 16px;
cursor: pointer;
margin-top: 16px;
transition: opacity 0.2s;
}
.btn-save-log:active { opacity: 0.8; }

.streak-row {
display: flex;
gap: 10px;
margin-bottom: 16px;
}
.streak-card {
flex: 1;
background-color: #222222;
background: #222222;
border-radius: 12px;
padding: 14px;
text-align: center;
border: 1px solid #2a2a2a;
}
.streak-num {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 36px;
color: var(–orange);
line-height: 1;
}
.streak-lbl { font-size: 10px; color: var(–text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

.toast {
position: fixed;
bottom: 90px;
left: 50%;
transform: translateX(-50%) translateY(20px);
background: var(–green);
color: white;
font-family: ‘Bebas Neue’, sans-serif;
font-size: 16px;
letter-spacing: 1px;
padding: 10px 24px;
border-radius: 99px;
opacity: 0;
transition: all 0.3s;
pointer-events: none;
white-space: nowrap;
z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* BOTTOM NAV */
.bottom-nav {
position: fixed;
bottom: 0; left: 0; right: 0;
background-color: #1a1a1a;
background: #1a1a1a;
border-top: 1px solid #2a2a2a;
display: flex;
padding: 8px 0;
padding-bottom: max(16px, env(safe-area-inset-bottom));
z-index: 200;
}
.nav-btn {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
background: none;
border: none;
cursor: pointer;
color: var(–text-dim);
font-size: 10px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.5px;
padding: 6px 0;
transition: color 0.2s;
}
.nav-btn.active { color: var(–orange); }
.nav-icon { font-size: 20px; }

hr.divider { border: none; border-top: 1px solid #2a2a2a; margin: 12px 0; }
</style>

</head>

    ],
    jazz: false,
    note: 'Recovery day. Let your body rebuild. Sleep is training.'
  },
];

const MILESTONES = [
  { month: 'May', target: 275, label: 'Habit formation' },
  { month: 'Jun', target: 267, label: 'First 10 lbs' },
  { month: 'Jul', target: 258, label: 'Halfway mark' },
  { month: 'Aug', target: 249, label: 'Under 250' },
  { month: 'Sep', target: 240, label: 'Final stretch' },
  { month: 'Oct', target: 230, label: '🎯 Goal reached' },
];

// State
let weightLog = JSON.parse(localStorage.getItem('weightLog') || '[]');
let sessionLog = JSON.parse(localStorage.getItem('sessionLog') || '{}');
let selectedLogDay = null;
let checkedItems = {};

function save() {
  localStorage.setItem('weightLog', JSON.stringify(weightLog));
  localStorage.setItem('sessionLog', JSON.stringify(sessionLog));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  const tabs = ['dashboard','schedule','log'];
  const idx = tabs.indexOf(id);
  document.querySelectorAll('.tab')[idx].classList.add('active');
  document.querySelectorAll('.nav-btn')[idx].classList.add('active');
  if (id === 'log') renderLogPage();
  if (id === 'dashboard') renderDashboard();
  if (id === 'schedule') renderSchedule();
}

function getCurrentWeight() {
  if (weightLog.length === 0) return START_WEIGHT;
  return weightLog[weightLog.length - 1].weight;
}

function logWeight() {
  const val = parseFloat(document.getElementById('weightEntry').value);
  if (isNaN(val) || val < 100 || val > 500) { showToast('Enter a valid weight'); return; }
  const today = new Date().toLocaleDateString('en-US', { month:'short', day:'numeric' });
  weightLog.push({ weight: val, date: today, ts: Date.now() });
  save();
  document.getElementById('weightEntry').value = '';
  renderDashboard();
  showToast('Weight logged! Keep going 💪');
}

function renderDashboard() {
  const cw = getCurrentWeight();
  const lost = Math.max(0, START_WEIGHT - cw);
  const toGo = Math.max(0, cw - GOAL_WEIGHT);
  const pct = Math.min(100, Math.round((lost / 50) * 100));

  document.getElementById('currentWeight').textContent = cw;
  document.getElementById('lostSoFar').textContent = lost.toFixed(1);
  document.getElementById('toGoVal').textContent = toGo.toFixed(1);
  document.getElementById('pctDone').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = pct + '% to goal';

  // Week badge
  const start = new Date('2025-05-01');
  const now = new Date();
  const diff = Math.floor((now - start) / (7 * 24 * 60 * 60 * 1000)) + 1;
  document.getElementById('weekBadge').textContent = 'WEEK ' + Math.max(1, diff);

  // Milestones
  const ml = document.getElementById('milestoneList');
  ml.innerHTML = '';
  MILESTONES.forEach((m, i) => {
    const reached = cw <= m.target;
    const isCurrent = !reached && (i === 0 || cw <= MILESTONES[i-1].target + 5);
    const div = document.createElement('div');
    div.className = 'milestone-item';
    div.innerHTML = `
      <div class="milestone-dot ${reached ? 'reached' : isCurrent ? 'current' : ''}"></div>
      <div class="milestone-month">${m.month}</div>
      <div>
        <div class="milestone-target">${m.target} lbs</div>
        <div class="milestone-label">${m.label}</div>
      </div>
      ${reached ? '<div class="milestone-check">✓</div>' : ''}
    `;
    ml.appendChild(div);
  });

  // History
  const hl = document.getElementById('historyList');
  if (weightLog.length === 0) {
    hl.innerHTML = '<div style="color:var(--text-dim);font-size:13px;text-align:center;padding:16px 0;">No entries yet. Log your first weight above.</div>';
    return;
  }
  const recent = [...weightLog].reverse().slice(0, 8);
  hl.innerHTML = '';
  recent.forEach((entry, i) => {
    const prev = weightLog[weightLog.length - 1 - i - 1];
    let deltaHtml = '';
    if (prev) {
      const delta = entry.weight - prev.weight;
      const sign = delta > 0 ? '+' : '';
      deltaHtml = `<span class="history-delta ${delta <= 0 ? 'delta-down' : 'delta-up'}">${sign}${delta.toFixed(1)}</span>`;
    }
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <div class="history-date">${entry.date}</div>
      <div class="history-weight">${entry.weight} lbs</div>
      ${deltaHtml}
    `;
    hl.appendChild(div);
  });
}

function renderSchedule() {
  const container = document.getElementById('dayCards');
  container.innerHTML = '';
  SCHEDULE.forEach((day, idx) => {
    const card = document.createElement('div');
    card.className = 'day-card';
    card.innerHTML = `
      <div class="day-header" onclick="toggleDay(this)">
        <div class="day-dot dot-${day.type}"></div>
        <div class="day-name type-${day.type}">${day.day}</div>
        <div class="day-type bg-${day.type}">${day.type.toUpperCase()}</div>
        <div class="day-chevron">▾</div>
      </div>
      <div class="day-body">
        ${day.times.map(t => `<div class="time-badge">${t}</div>`).join('')}
        ${day.jazz ? `<div class="jazz-tag">💕 Jazz Workout</div>` : ''}
        <div class="exercise-list">
          ${day.exercises.map(e => `
            <div class="exercise-item">
              <div class="exercise-bullet" style="background:${day.type==='gym'?'var(--orange)':day.type==='walk'?'var(--green)':day.type==='golf'?'var(--blue)':'var(--muted)'}"></div>
              <span>${e.name}</span>
              <span class="exercise-sets">${e.sets}</span>
            </div>
          `).join('')}
        </div>
        ${day.jazz && day.jazzExercises ? `
          <hr class="divider">
          <div style="font-size:12px;color:var(--rose);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Couples Circuit</div>
          <div class="exercise-list">
            ${day.jazzExercises.map(e => `
              <div class="exercise-item">
                <div class="exercise-bullet" style="background:var(--rose)"></div>
                <span style="color:var(--text)">${e}</span>
              </div>
            `).join('')}
          </div>
          <div style="font-size:11px;color:var(--text-dim);margin-top:8px;">Jazz does modified prenatal-safe versions. Avoid back-flat exercises in 2nd/3rd trimester. Consult OB.</div>
        ` : ''}
        ${day.jazz && !day.jazzExercises ? `
          <div style="font-size:12px;color:var(--rose);margin-top:4px;margin-bottom:8px;">💕 ${day.jazzNote}</div>
        ` : ''}
        <div style="font-size:12px;color:var(--text-dim);margin-top:10px;font-style:italic;">${day.note}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleDay(header) {
  const card = header.parentElement;
  card.classList.toggle('open');
}

function renderLogPage() {
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const grid = document.getElementById('logDayGrid');
  grid.innerHTML = '';
  const today = new Date().getDay(); // 0=Sun
  const weekKey = getWeekKey();

  days.forEach((d, i) => {
    const dayKey = weekKey + '_' + i;
    const logged = sessionLog[dayKey];
    const btn = document.createElement('button');
    btn.className = 'log-day-btn' + (logged ? ' logged' : '') + (selectedLogDay === i ? ' selected' : '');
    btn.innerHTML = `<span class="day-abbr">${d}</span>${logged ? '✓' : ''}`;
    btn.onclick = () => selectLogDay(i);
    grid.appendChild(btn);
  });

  updateStreaks();
}

function getWeekKey() {
  const d = new Date();
  const day = d.getDay();
  const monday = new Date(d);
  monday.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return monday.toISOString().slice(0, 10);
}

function selectLogDay(dayIdx) {
  selectedLogDay = dayIdx;
  checkedItems = {};
  renderLogPage();
  const sched = SCHEDULE[dayIdx];
  const section = document.getElementById('checklistSection');
  const title = document.getElementById('checklistTitle');
  const list = document.getElementById('sessionChecklist');

  section.style.display = 'block';
  title.textContent = sched.day + ' — ' + sched.type.charAt(0).toUpperCase() + sched.type.slice(1);
  list.innerHTML = '';

  const items = [
    ...sched.exercises.map(e => ({ label: e.name, sub: e.sets })),
    { label: '💧 Stayed hydrated', sub: '' },
    { label: '💊 Took creatine (5g)', sub: 'Daily non-negotiable' },
    ...(sched.type !== 'rest' ? [{ label: '🚶 Hit 8,000+ steps', sub: 'Check Apple Health' }] : []),
    ...(sched.jazz ? [{ label: '💕 Did workout with Jazz', sub: sched.jazzNote || 'Couples session' }] : []),
  ];

  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'check-item';
    div.id = 'ci_' + i;
    div.innerHTML = `
      <div class="check-box">✓</div>
      <div>
        <div class="check-label">${item.label}</div>
        ${item.sub ? `<div class="check-sub">${item.sub}</div>` : ''}
      </div>
    `;
    div.onclick = () => toggleCheck(i, div);
    list.appendChild(div);
  });
}

function toggleCheck(i, div) {
  checkedItems[i] = !checkedItems[i];
  div.classList.toggle('checked', checkedItems[i]);
}

function saveLog() {
  if (selectedLogDay === null) return;
  const weekKey = getWeekKey();
  const dayKey = weekKey + '_' + selectedLogDay;
  sessionLog[dayKey] = { ts: Date.now(), day: SCHEDULE[selectedLogDay].day };
  save();
  document.getElementById('checklistSection').style.display = 'none';
  selectedLogDay = null;
  checkedItems = {};
  renderLogPage();
  showToast('Session logged! 🔥');
}

function updateStreaks() {
  const weekKey = getWeekKey();
  let weekCount = 0;
  for (let i = 0; i < 7; i++) {
    if (sessionLog[weekKey + '_' + i]) weekCount++;
  }
  document.getElementById('weeklyLogged').textContent = weekCount;
  document.getElementById('totalLogged').textContent = Object.keys(sessionLog).length;

  // Simple streak: count consecutive days
  let streak = 0;
  const now = new Date();
  for (let i = 0; i < 60; i++) {
    const d = new Date(now);
    d.setDate(now.getDate() - i);
    const day = d.getDay();
    const monday = new Date(d);
    monday.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
    const wk = monday.toISOString().slice(0, 10);
    const dk = wk + '_' + (day === 0 ? 6 : day - 1);
    if (sessionLog[dk]) streak++;
    else if (i > 0) break;
  }
  document.getElementById('streakNum').textContent = streak;
}

// Init
renderDashboard();
renderSchedule();
</script>

</body>
</html>
